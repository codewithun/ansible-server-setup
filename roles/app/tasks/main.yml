---
- name: Create website directory
  ansible.builtin.file:
    path: /var/www/pomodoro-site
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  tags:
    - app

- name: Upload website tarball
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/website.tar.gz"
    dest: /tmp/website.tar.gz
    mode: "0644"
  tags:
    - app

- name: Extract website archive
  ansible.builtin.unarchive:
    src: /tmp/website.tar.gz
    dest: /var/www/pomodoro-site
    remote_src: true
    owner: www-data
    group: www-data
  tags:
    - app

- name: Remove uploaded archive
  ansible.builtin.file:
    path: /tmp/website.tar.gz
    state: absent
  tags:
    - app
